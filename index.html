<!DOCTYPE html>
<html lang="km" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Image Processing — Interactive Learning & Exam Practice</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
              950: '#1e1b4b',
            }
          }
        }
      }
    }
  </script>

  <!-- KaTeX Math Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

  <!-- Top Navigation Bar -->
  <header class="sticky top-0 z-50 backdrop-blur-xl bg-slate-950/80 border-b border-slate-800/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/20 ring-1 ring-white/20">
          <i data-lucide="layers" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <div class="text-base font-extrabold tracking-tight text-white flex items-center gap-1.5">
            <span>DIP Interactive</span>
            <span class="text-[10px] uppercase font-mono px-1.5 py-0.5 rounded bg-indigo-950 text-indigo-300 border border-indigo-800">Pro</span>
          </div>
          <p class="text-[11px] text-slate-400 khmer-font">លំហាត់ និងដំណោះស្រាយ Digital Image Processing</p>
        </div>
      </div>

      <!-- Header Actions -->
      <div class="flex items-center gap-3">
        <!-- Language Switcher Button -->
        <button id="lang-toggle-btn" class="px-3 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-700 text-xs font-semibold flex items-center gap-1.5 transition shadow-sm">
          <i data-lucide="globe" class="w-4 h-4 text-indigo-400"></i>
          <span>ភាសាខ្មែរ (Khmer)</span>
        </button>
      </div>
    </div>

    <!-- Secondary Navigation Tabs -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 border-t border-slate-900/60 overflow-x-auto py-2">
      <div id="main-nav-tabs" class="flex items-center gap-2 min-w-max">
        <!-- Dynamic tabs rendered by app.js -->
      </div>
    </div>
  </header>

  <!-- Main Content Body -->
  <main id="main-tab-content" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Rendered dynamically by app.js -->
    <div class="flex items-center justify-center py-24 text-slate-500">
      <i data-lucide="loader-2" class="w-8 h-8 animate-spin text-indigo-500"></i>
    </div>
  </main>

  <!-- Footer -->
  <footer class="mt-auto border-t border-slate-800/80 bg-slate-950/60 py-6 text-center text-xs text-slate-500">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center gap-2 font-mono">
        <span>Digital Image Processing Master Course</span>
        <span>•</span>
        <span>8 Exercises & Solutions</span>
      </div>
      <div class="khmer-font text-slate-400">
        រៀបចំសម្រាប់ជំនួយស្មារតីក្នុងការរៀន និងត្រៀមប្រឡងប្រព័ន្ធដំណើរការរូបភាពឌីជីថល
      </div>
    </div>
  </footer>

  <!-- Core JavaScript Modules -->
  <script src="js/exercises-data.js"></script>
  <script src="js/spatial-filter-lab.js"></script>
  <script src="js/color-lab.js"></script>
  <script src="js/morphology-lab.js"></script>
  <script src="js/quiz-engine.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
